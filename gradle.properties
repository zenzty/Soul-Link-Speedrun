# Gradle
# Memory bump plus the --add-exports required by palantir-java-format (Spotless) on JDK 16+.
org.gradle.jvmargs=-Xmx2048m --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties (check these on https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=1.5.0
maven_group=net.zenzty.soullink
archives_base_name=soullink

# Mod dependencies
fabric_api_version=0.152.1+26.2
fantasy_version=0.8.2+26.2

# Build tooling
spotless_version=8.6.0
checkstyle_version=13.6.0
